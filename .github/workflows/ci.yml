name: LearnTranslate CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/v1g5c3-quota-runtime.test.mjs
      - run: node --test tests/v1g6-cost-reservation.test.mjs
      - run: node --test tests/v1g7a-origin-session.test.mjs
      - run: node --test tests/v1g7b1-session-validation.test.mjs
      - run: node --test tests/v1g7b2-refresh-singleflight.test.mjs
      - run: node --test tests/v1g7b3-logout-revocation.test.mjs
      - run: node --test tests/v1g7c1-verified-abuse.test.mjs
      - run: node --test tests/v1g7c2-request-payload-guard.test.mjs
      - run: node --test tests/v1g7d2a-bounded-session.test.mjs
      - run: node --test tests/v1g7d2b-session-token-pair.test.mjs
      - run: node --test tests/v1g7d2b-preview-auth.test.mjs
      - run: node --test tests/v1g7d2c-transient-refresh.test.mjs
      - run: node --test tests/v1g7d2d1-refresh-retry-ui.test.mjs
      - run: node --test tests/v1g7d2d2-redis-connectivity.test.mjs
      - run: node --test tests/v1g7d2d3b-refresh-primitives.test.mjs
      - run: node --test tests/v1g7d2d3c-redis-lease-client.test.mjs
      - run: node --test tests/v1g7d2d3d-independent-workers.test.mjs
      - run: node --test tests/v1g7d2d3e-refresh-coordinator.test.mjs
      - run: node --test tests/v1g7d2d3f-secure-redis-adapter.test.mjs
      - run: node --test tests/v1g7d2d3g-auth-integration-guardrails.test.mjs
      - run: node --test tests/v1g7d2d3h-flagged-auth-refresh.test.mjs
      - run: node --test tests/v1g7d2d3i-secure-adapter-behavior.test.mjs
      - run: node --test tests/v1g7d2d3j-session-identity-binding.test.mjs
      - run: node --test tests/v1g7d2d3k-identity-binding-route.test.mjs
      - run: node --test tests/v1g7d2d3l-concurrency-regression.test.mjs
      - run: node --test tests/v1g7d2d3m-response-race-audit.test.mjs
      - run: node --test tests/v1g7d2d3n-browser-session-queue.test.mjs
      - run: node --test tests/v1g7d2d3o-cross-tab-notices.test.mjs
      - run: node --test tests/v1g7d2d3p-session-recovery.test.mjs
      - run: node --test tests/v1g7d2d3q-legacy-refresh-race.test.mjs
      - run: node --test tests/v1g7d2d3r-cross-tab-web-lock.test.mjs
      - run: node --test tests/v1g7d2d4-signout-race.test.mjs
      - run: node --test tests/v1g7d2d5-online-session-recovery.test.mjs
      - run: node --test tests/v1g7d2d6-stale-callback-guard.test.mjs
      - run: node --test tests/v1g7d2d7-auth-verification.test.mjs
      - run: node --test tests/v1h1-reverse-search-whitespace.test.mjs
      - run: node --test tests/v1h2-card-presentation.test.mjs
      - run: node --test tests/v1h3-single-candidate-search.test.mjs
      - run: node --test tests/v1h4-article-accurate-reuse.test.mjs
      - run: node --test tests/v1h5-reverse-sense-normalization.test.mjs
      - run: node --test tests/v1h6-paginated-published-search.test.mjs
      - run: node --test tests/v1h13-migration-preflight.test.mjs
      - run: node --test tests/v1h15-flagged-indexed-rpc.test.mjs
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: learntranslate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d learntranslate_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: learntranslate_test
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable schema
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/v1h14-fixture.sql
      - name: Validate release preflight against fixture
        run: psql -v ON_ERROR_STOP=1 -f docs/sql/v1h17-production-preflight.sql
      - name: Install normalization dependency
        run: |
          sed -n '1,/-- V1-H.7 staged database-side fallback lookup/ p' docs/sql/v1h7-lookup-published-card-fallback.sql | sed '$d' | psql -v ON_ERROR_STOP=1
      - name: Execute staged migration SQL
        run: psql -v ON_ERROR_STOP=1 -f docs/sql/v1h12-indexed-search-migration-candidate.sql
      - name: Verify database behavior
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/v1h14-assertions.sql
      - name: Install indexed RPC in disposable database
        run: psql -v ON_ERROR_STOP=1 -f docs/sql/v1h16-published-indexed-rpc.sql
      - name: Test indexed RPC security and search behavior
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/v1h17-release-assertions.sql
      - name: Test indexed RPC mutation lifecycle
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/v1h16-rpc-assertions.sql
