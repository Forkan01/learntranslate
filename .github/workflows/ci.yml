name: LearnTranslate CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/v1g5c3-quota-runtime.test.mjs
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
