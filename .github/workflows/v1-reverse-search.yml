name: V1 Reverse Search Contract
on:
  pull_request:
    paths:
      - 'src/app/api/cards/search/route.ts'
      - 'src/app/search/page.tsx'
      - 'tests/v1f-reverse-search-contract.test.mjs'
      - '.github/workflows/v1-reverse-search.yml'
  push:
    branches: [main]
    paths:
      - 'src/app/api/cards/search/route.ts'
      - 'src/app/search/page.tsx'
      - 'tests/v1f-reverse-search-contract.test.mjs'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/v1f-reverse-search-contract.test.mjs
