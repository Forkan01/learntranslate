name: Manual encrypted Supabase database backup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: restore_test_only
          POSTGRES_DB: restore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d restore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Ensure backup secrets exist
        env:
          DB_URL: ${{ secrets.SUPABASE_BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.SUPABASE_BACKUP_PASSPHRASE }}
        run: |
          test -n "$DB_URL" || { echo "Missing SUPABASE_BACKUP_DATABASE_URL"; exit 1; }
          test -n "$BACKUP_PASSPHRASE" || { echo "Missing SUPABASE_BACKUP_PASSPHRASE"; exit 1; }
          test "${#BACKUP_PASSPHRASE}" -ge 20 || { echo "Backup passphrase must be at least 20 characters"; exit 1; }
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
      - name: Dump and validate backup without printing credentials
        env:
          DB_URL: ${{ secrets.SUPABASE_BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.SUPABASE_BACKUP_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p backup
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/pg_restore --version
          # The URL is never passed as a command-line argument or written to the artifact.
          export PGCONNECT_TIMEOUT=15
          export PGSSLMODE=require
          export PGDATABASE_URL_UNUSED=""
          /usr/lib/postgresql/17/bin/pg_dump --dbname="$DB_URL" --format=custom --no-owner --no-acl \
            --schema=public --schema=private --file=backup/database.dump
          test -s backup/database.dump
          /usr/lib/postgresql/17/bin/pg_restore --list backup/database.dump > backup/contents.txt
          grep -Eq 'TABLE DATA.*cards|TABLE DATA.*public cards' backup/contents.txt
          sha256sum backup/database.dump > backup/sha256.txt
          openssl enc -aes-256-cbc -pbkdf2 -salt -iter 200000 \
            -in backup/database.dump -out backup/database.dump.enc \
            -pass env:BACKUP_PASSPHRASE
          # Check the encryption round trip before discarding the plaintext.
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in backup/database.dump.enc -out backup/roundtrip.dump \
            -pass env:BACKUP_PASSPHRASE
          cmp backup/database.dump backup/roundtrip.dump
          rm -f backup/roundtrip.dump
          echo "Encrypted backup created and integrity checked."
      - name: Restore archive to disposable PostgreSQL 17
        env:
          PGPASSWORD: restore_test_only
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGDATABASE: restore_test
        shell: bash
        run: |
          set -euo pipefail
          # Fresh PostgreSQL creates public by default; the archive creates it too.
          # Drop only in this disposable local service, never in production.
          /usr/lib/postgresql/17/bin/psql -X -v ON_ERROR_STOP=1 -c "DROP SCHEMA public CASCADE;"
          # Supabase policy definitions reference cluster roles not included in pg_dump.
          /usr/lib/postgresql/17/bin/psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN;"
          /usr/lib/postgresql/17/bin/psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE authenticated NOLOGIN;"
          /usr/lib/postgresql/17/bin/psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE service_role NOLOGIN;"
          /usr/lib/postgresql/17/bin/pg_restore \
            --dbname=restore_test --no-owner --no-acl --exit-on-error \
            backup/database.dump
          /usr/lib/postgresql/17/bin/psql -X -v ON_ERROR_STOP=1 -Atqc \
            "select count(*) from public.cards" > backup/restored-card-count.txt
          test "$(cat backup/restored-card-count.txt)" -gt 0
          echo "Disposable restore completed. Restored cards: $(cat backup/restored-card-count.txt)"
      - name: Remove plaintext dump
        if: always()
        shell: bash
        run: rm -f backup/database.dump backup/roundtrip.dump
      - name: Upload encrypted backup (short retention)
        uses: actions/upload-artifact@v4
        with:
          name: supabase-encrypted-backup
          path: |
            backup/database.dump.enc
            backup/sha256.txt
            backup/contents.txt
            backup/restored-card-count.txt
          retention-days: 1
          if-no-files-found: error
