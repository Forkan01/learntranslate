name: Bootstrap LearnTranslate
on:
  workflow_dispatch:
  push:
    branches: [feature/lt-01-foundation]
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lt-01-foundation
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scaffold Next.js
        run: |
          npx --yes create-next-app@latest scaffold --typescript --tailwind --eslint --app --src-dir --import-alias "@/*" --use-npm --yes --disable-git
          cp -a scaffold/. .
          rm -rf scaffold
      - name: Commit foundation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: bootstrap Next.js foundation and CI" || exit 0
          git push origin HEAD:feature/lt-01-foundation
