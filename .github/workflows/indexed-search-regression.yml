name: Indexed search API regression
on:
  pull_request:
    paths:
      - 'src/app/api/cards/search/route.ts'
      - 'src/lib/cards/schema.ts'
      - 'tests/indexed-search-route.test.cjs'
      - '.github/workflows/indexed-search-regression.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/indexed-search-route.test.cjs
